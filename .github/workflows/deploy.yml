name: Deploy a Hostinger (producción)

# Pipeline de despliegue automático de la landing de AMSAR.
#   push a main  ->  build de producción  ->  deploy FTPS a public_html  ->  verificación
# Build: GitHub Actions (Ubuntu + Node 20). Deploy: FTPS con sync incremental
# (sube solo lo cambiado, mantiene .htaccess y elimina obsoletos vía state-file).
# Sube ÚNICAMENTE el build estático (dist/public). NUNCA código fuente.

on:
  push:
    branches: [main]
  workflow_dispatch: {}          # permite lanzar un deploy manual desde la pestaña Actions

# Evita deploys solapados (sin downtime ni condiciones de carrera).
concurrency:
  group: deploy-hostinger-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias (reproducible)
        run: npm ci

      # Gate de errores: si el build falla, el job falla y NO se despliega nada.
      - name: Build de producción
        run: npm run build

      # Guard anti-regresión (objetivo 7): solo se despliega un build VÁLIDO,
      # nunca código fuente. dist/public solo contiene el output estático.
      - name: Verificar build (anti-deploy de código fuente)
        run: |
          set -e
          test -f dist/public/index.html || { echo "::error::falta dist/public/index.html"; exit 1; }
          test -f dist/public/.htaccess  || { echo "::error::falta dist/public/.htaccess"; exit 1; }
          test -d dist/public/assets     || { echo "::error::falta dist/public/assets/"; exit 1; }
          ls dist/public/assets/*.js >/dev/null 2>&1 || { echo "::error::no hay bundle JS en dist/public/assets/"; exit 1; }
          if grep -q "/src/main.tsx" dist/public/index.html; then
            echo "::error::index.html apunta a /src/main.tsx (código fuente). Build inválido. Abortando deploy."
            exit 1
          fi
          grep -q "/assets/" dist/public/index.html || { echo "::error::index.html no referencia /assets/. Build inválido."; exit 1; }
          echo "Build OK: index.html buildeado + assets + .htaccess. Seguro para deploy."

      # Deploy por FTPS. local-dir = SOLO el build estático: jamás sube src/, api/,
      # package.json, node_modules ni dist/boot.js. El .htaccess viaja en dist/public.
      - name: Deploy a Hostinger (FTPS, sync incremental)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/public/
          # La cuenta FTP ya entra en el document root (Hostinger "Folder to upload
          # files: public_html"). Por eso server-dir es ./ — usar public_html/ creaba
          # un public_html/public_html anidado que NO se servía.
          server-dir: ./
          # Sin dangerous-clean-slate: evita downtime. El state-file gestiona altas/bajas.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Verificar sitio en producción
        run: |
          set -e
          echo "Verificando https://amsarsalud.com ..."
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" -L https://amsarsalud.com/)
          echo "HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::El sitio no devolvió 200 (devolvió $code)"
            exit 1
          fi
          if curl -s -L https://amsarsalud.com/ | grep -q "Amsar Salud"; then
            echo "Sitio OK: responde 200 y sirve el contenido esperado."
          else
            echo "::warning::200 OK pero no se encontró el texto esperado (posible caché de Cloudflare)."
          fi
